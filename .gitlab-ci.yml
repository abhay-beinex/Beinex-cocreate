# Type-check and build on every push and merge request, plus GitLab's SAST and Secret Detection scans.
# The build runs the same way as the release image: model calls go to the proxy, no key in the bundle.
# Auto DevOps is deliberately not included: releases are done by hand (docs/deployment.md).
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - check
  - test

build:
  stage: check
  image: node:20-alpine
  variables:
    VITE_MODEL_API_BASE: /api/v1
    VITE_OPENROUTER_API_KEY: ""
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
    - if grep -rq "sk-or-" dist; then echo "Model key found in bundle" >&2; exit 1; fi
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
