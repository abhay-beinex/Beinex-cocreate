# Type-check and build on every push and merge request.
# The build runs the same way as the release image: model calls go to the proxy, no key in the bundle.
image: node:20-alpine

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - check

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

build:
  stage: check
  variables:
    VITE_MODEL_API_BASE: /api/v1
    VITE_OPENROUTER_API_KEY: ""
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
    - if grep -rq "sk-or-" dist; then echo "Model key found in bundle" >&2; exit 1; fi
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
